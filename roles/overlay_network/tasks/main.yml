---
# D-10: report Tailscale; optionally allow SSH on tailscale0 only.
- name: Check whether Tailscale is installed
  ansible.builtin.command:
    argv: [pacman, -Q, tailscale]
  register: aegis_ts_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the Tailscale state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: aegis_ts_status
  changed_when: false
  failed_when: false
  check_mode: false
  timeout: 30
  when: aegis_ts_installed.rc == 0

- name: Allow SSH on the Tailscale interface only
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ aegis_overlay_interface }}"
    port: "{{ aegis_overlay_ssh_port | string }}"
    proto: tcp
    comment: aegis-ssh-overlay
    delete: "{{ not aegis_overlay_ssh_on_tailscale | bool }}"
  when: not (aegis_drift_check_run | default(false) | bool)

- name: Read the firewall back
  ansible.builtin.command:
    argv: [ufw, status]
  register: aegis_ts_ufw
  changed_when: false
  check_mode: false
  when: not (aegis_drift_check_run | default(false) | bool)

- name: Verify the overlay SSH rule matches the setting
  vars:
    # Plain `ufw status` prints ALLOW; `ufw status verbose` prints ALLOW IN.
    aegis_rule_re: '(?m)^{{ aegis_overlay_ssh_port }}/tcp on {{ aegis_overlay_interface }}\s+ALLOW\b'
  ansible.builtin.assert:
    that: (aegis_ts_ufw.stdout is search(aegis_rule_re)) == (aegis_overlay_ssh_on_tailscale | bool)
    fail_msg: >-
      SSH on {{ aegis_overlay_interface }} should be
      {{ 'open' if aegis_overlay_ssh_on_tailscale | bool else 'closed' }}
    quiet: true
  when: not ansible_check_mode

# D-33: in the drift check, ufw cannot run (no write access to /run/ufw.lock
# or /etc/ufw), so read its rule files. The pattern is the rule the task above
# adds: allow tcp <port> from any to any, in on the interface.
- name: Read ufw's rule files (drift check, D-33)
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ aegis_overlay_ufw_rules_files }}"
  register: aegis_ts_rules
  when: aegis_drift_check_run | default(false) | bool

- name: Report a run would change the overlay SSH rule (drift check, D-33)
  vars:
    aegis_text: "{{ aegis_ts_rules.results | map(attribute='content') | map('b64decode') | join('\n') }}"
    aegis_re: >-
      (?m)^### tuple ### allow tcp {{ aegis_overlay_ssh_port }} (0\.0\.0\.0/0|::/0) any (0\.0\.0\.0/0|::/0)
      in_{{ aegis_overlay_interface | regex_escape }}( comment=\S*)?$
    aegis_present: "{{ aegis_text is search(aegis_re) }}"
  ansible.builtin.debug:
    msg: >-
      SSH on {{ aegis_overlay_interface }} should be
      {{ 'open' if aegis_overlay_ssh_on_tailscale | bool else 'closed' }}; a run would fix it
  changed_when: true
  when:
    - aegis_drift_check_run | default(false) | bool
    - aegis_present | bool != aegis_overlay_ssh_on_tailscale | bool

# D-24: with Tailscale's default --netfilter-mode=on, INPUT jumps to ts-input
# before every ufw chain and ts-input accepts all of tailscale0. Measured in
# the VM (2026-10-24): a tailnet peer reached a test port with the rule above
# absent and present. So report who really governs tailscale0.
- name: Read the start of the INPUT chain
  ansible.builtin.command:
    argv: [iptables, -S, INPUT]
  register: aegis_ts_input
  changed_when: false
  failed_when: false
  check_mode: false
  when: aegis_ts_installed.rc == 0

- name: Read sshd's effective password settings and authorized key types
  aegis_ssh_audit:
    sshd_path: "{{ aegis_overlay_sshd_path }}"
  register: aegis_ssh

- name: Record the overlay finding
  vars:
    aegis_state: >-
      {{ ((aegis_ts_status.stdout | default('{}', true)) | from_json).BackendState | default('unknown')
         if aegis_ts_installed.rc == 0 else 'not installed' }}
    aegis_bypass: >-
      {{ aegis_state == 'Running'
         and (aegis_ts_input.stdout | default('')) is search('(?m)^-A INPUT -j ts-input$') }}
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'network.overlay',
            'status': 'WARN' if aegis_bypass | bool else ('PASS' if aegis_state == 'Running' else 'INFO'),
            'detail': 'Tailscale: ' ~ aegis_state
                      ~ ('; Tailscale accepts every inbound connection on ' ~ aegis_overlay_interface
                         ~ ' before ufw (netfilter mode on), so tailnet peers reach every listening port.'
                         ~ ' Your tailnet access policy and the login at your identity provider decide who'
                         ~ ' that is: use a passkey or security key there (D-24)'
                         ~ ('. The SSH rule on ' ~ aegis_overlay_interface ~ ' has no effect in this mode'
                            if aegis_overlay_ssh_on_tailscale | bool else '')
                         if aegis_bypass | bool
                         else ('; ufw governs ' ~ aegis_overlay_interface if aegis_state == 'Running' else ''))
                      ~ ('' if aegis_ts_installed.rc == 0
                         else ' (install with omarchy-install-service-tailscale, then tailscale up)')}
         ] }}

- name: Record the SSH findings (D-24)
  vars:
    aegis_password_on: >-
      {{ aegis_ssh.password_authentication | default('') == 'yes'
         or aegis_ssh.kbdinteractive_authentication | default('') == 'yes' }}
    aegis_soft_keys: "{{ aegis_ssh.authorized_keys | default([]) | rejectattr('hardware') | list }}"
  ansible.builtin.set_fact:
    aegis_findings: >-
      {%- set out = [] -%}
      {%- if aegis_ssh.installed and aegis_ssh.effective_error -%}
        {%- set _ = out.append({'id': 'ssh.password_auth', 'status': 'INFO',
              'detail': 'could not read sshd -T (' ~ aegis_ssh.effective_error
                        ~ '), so the password setting is unknown'}) -%}
      {%- elif aegis_ssh.installed -%}
        {%- set _ = out.append({'id': 'ssh.password_auth',
              'status': 'WARN' if aegis_password_on | bool else 'PASS',
              'detail': 'sshd in force: passwordauthentication ' ~ aegis_ssh.password_authentication
                        ~ ', kbdinteractiveauthentication ' ~ aegis_ssh.kbdinteractive_authentication
                        ~ ('; password logins are open to every tailnet peer, and to the LAN if its SSH'
                           ~ ' rule is back. Authorize a key with omarchy-setup-security-sshd, which turns'
                           ~ ' passwords off' if aegis_password_on | bool else '')}) -%}
        {%- set _ = out.append({'id': 'ssh.authorized_keys',
              'status': 'INFO' if aegis_soft_keys else 'PASS',
              'detail': ((aegis_soft_keys | length | string) ~ ' authorized key(s) not on a hardware key: '
                         ~ (aegis_soft_keys | map(attribute='user') | zip(aegis_soft_keys | map(attribute='type'))
                            | map('join', ' ') | join(', '))
                         ~ '. An sk- key (ssh-keygen -t ed25519-sk) cannot be copied off the machine')
                        if aegis_soft_keys
                        else (aegis_ssh.authorized_keys | length | string)
                             ~ ' authorized key(s), all hardware-backed'}) -%}
      {%- endif -%}
      {{ (aegis_findings | default([])) + out }}
