---
# Persistent tally (roadmap G1): pam_faillock's default dir is /var/run/faillock,
# which is tmpfs, so a reboot would reset every counter.
#
# 0755, not 0700. Omarchy's lock screen runs PAM as the user, and
# pam_faillock gives each user their own tally file (user:user 0660) for
# exactly that case. Behind a 0700 directory the lock screen recorded no
# failures at all, silently, because pam_faillock returns success on EACCES
# (measured on the VM, 2026-10-22). This matches pam_faillock's own
# mkdir(dir, 0755).
- name: Create the persistent faillock tally directory
  ansible.builtin.file:
    path: "{{ aegis_faillock_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the tally directory across boots
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/aegis-faillock.conf
    content: |
      # Managed by Omarchy-Hardened (pam_faillock role).
      d {{ aegis_faillock_dir }} 0755 root root -
    owner: root
    group: root
    mode: "0644"

- name: Look for polkit's sandboxed PAM helper unit (D-27)
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/{{ aegis_faillock_polkit_helper_unit }}
  register: aegis_faillock_polkit_helper

- name: Let polkit's PAM helper write the faillock tally (D-27)
  when: aegis_faillock_polkit_helper.stat.exists
  block:
    - name: Create the polkit helper drop-in directory
      ansible.builtin.file:
        path: "{{ aegis_faillock_polkit_helper_dropin | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the polkit helper drop-in
      ansible.builtin.copy:
        dest: "{{ aegis_faillock_polkit_helper_dropin }}"
        content: |
          # Managed by Omarchy-Hardened (pam_faillock role, D-27).
          # ProtectSystem=strict makes the tally directory read-only for
          # pam_faillock in this unit; without this, pkexec refuses every password.
          [Service]
          ReadWritePaths={{ aegis_faillock_dir }}
        owner: root
        group: root
        mode: "0644"
      register: aegis_faillock_polkit_dropin_written

    # Each authentication starts a new instance, so a reload is all it needs.
    - name: Reload systemd after the drop-in changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: aegis_faillock_polkit_dropin_written is changed and not ansible_check_mode
      failed_when: false # no systemd in a container; the drop-in is still read back below

    - name: Check whether systemd is running
      ansible.builtin.stat:
        path: /run/systemd/system
      register: aegis_faillock_systemd

    - name: Read the helper's writable paths as systemd loads them
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - -P
          - ReadWritePaths
          - "{{ aegis_faillock_polkit_helper_unit | replace('@.', '@aegis-check.') }}"
      register: aegis_faillock_polkit_rw
      changed_when: false
      check_mode: false
      when: aegis_faillock_systemd.stat.exists

    - name: Read back the polkit helper drop-in
      ansible.builtin.slurp:
        src: "{{ aegis_faillock_polkit_helper_dropin }}"
      register: aegis_faillock_polkit_dropin
      when: not ansible_check_mode or aegis_faillock_polkit_dropin_written is not changed

    - name: Assert polkit's PAM helper may write the tally directory
      ansible.builtin.assert:
        that:
          - (aegis_faillock_polkit_dropin.content | b64decode)
            is search('(?m)^ReadWritePaths=' ~ (aegis_faillock_dir | regex_escape) ~ '$')
          - not aegis_faillock_systemd.stat.exists
            or aegis_faillock_dir in (aegis_faillock_polkit_rw.stdout | split)
        fail_msg: >-
          {{ aegis_faillock_polkit_helper_unit }} cannot write {{ aegis_faillock_dir }}
          (systemd reports ReadWritePaths={{ aegis_faillock_polkit_rw.stdout | default('n/a') }}),
          so pkexec would refuse every password (D-27).
        quiet: true
      when: not ansible_check_mode or aegis_faillock_polkit_dropin_written is not changed

- name: Set the faillock defaults in faillock.conf
  ansible.builtin.lineinfile:
    path: "{{ aegis_faillock_conf }}"
    regexp: '^\s*#?\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop:
    - { key: deny, value: "{{ aegis_faillock_deny }}" }
    - { key: unlock_time, value: "{{ aegis_faillock_unlock_time }}" }
    - { key: dir, value: "{{ aegis_faillock_dir }}" }
  loop_control:
    label: "{{ item.key }}"

- name: Set the faillock flag options (audit, even_deny_root)
  ansible.builtin.lineinfile:
    path: "{{ aegis_faillock_conf }}"
    regexp: '^\s*{{ item.key }}\s*$'
    line: "{{ item.key }}"
    state: "{{ 'present' if item.value | bool else 'absent' }}"
    backup: true
  loop:
    - { key: audit, value: "{{ aegis_faillock_audit }}" }
    - { key: even_deny_root, value: "{{ aegis_faillock_even_deny_root }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Set root_unlock_time
  ansible.builtin.lineinfile:
    path: "{{ aegis_faillock_conf }}"
    regexp: '^\s*#?\s*root_unlock_time\s*='
    line: "root_unlock_time = {{ aegis_faillock_root_unlock_time }}"
    state: "{{ 'present' if aegis_faillock_even_deny_root | bool else 'absent' }}"
    backup: true

- name: Find the PAM files that carry inline faillock arguments
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ aegis_faillock_pam_files }}"
  register: aegis_faillock_pam_stats

- name: Select the PAM files present on this host
  ansible.builtin.set_fact:
    aegis_faillock_present_pam_files: >-
      {{ aegis_faillock_pam_stats.results
         | selectattr('stat.exists')
         | map(attribute='item')
         | list }}

- name: Rewrite inline deny= on pam_faillock lines
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(\s*auth\s.*pam_faillock\.so\b.*\s)deny=\d+'
    replace: '\g<1>deny={{ aegis_faillock_deny }}'
    backup: true
  loop: "{{ aegis_faillock_present_pam_files }}"

- name: Rewrite inline unlock_time= on pam_faillock lines
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(\s*auth\s.*pam_faillock\.so\b.*\s)unlock_time=\d+'
    replace: '\g<1>unlock_time={{ aegis_faillock_unlock_time }}'
    backup: true
  loop: "{{ aegis_faillock_present_pam_files }}"

# Verification. A regex that stops matching after an upstream change would make
# the two tasks above silent no-ops, so read the files back and check the values
# that will actually be in force.
- name: Read back the PAM files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ aegis_faillock_present_pam_files }}"
  register: aegis_faillock_pam_contents
  when: not ansible_check_mode

- name: Assert no pam_faillock line overrides the hardened values
  vars:
    aegis_faillock_lines: >-
      {{ item.content | b64decode | regex_findall('(?m)^\s*auth\s.*pam_faillock\.so.*$') }}
    aegis_faillock_inline: >-
      {{ aegis_faillock_lines | join('\n') | regex_findall('(deny|unlock_time)=(\d+)') }}
    aegis_faillock_inline_dirs: >-
      {{ aegis_faillock_lines | join('\n') | regex_findall('\sdir=(\S+)') }}
  ansible.builtin.assert:
    that:
      - aegis_faillock_lines | length > 0
      - aegis_faillock_inline
        | rejectattr('0', 'equalto', 'deny') | map(attribute='1') | map('int')
        | reject('equalto', aegis_faillock_unlock_time | int) | list | length == 0
      - aegis_faillock_inline
        | selectattr('0', 'equalto', 'deny') | map(attribute='1') | map('int')
        | reject('equalto', aegis_faillock_deny | int) | list | length == 0
      # An inline dir= would silently move the tally back to tmpfs.
      - aegis_faillock_inline_dirs | reject('equalto', aegis_faillock_dir) | list | length == 0
    fail_msg: >-
      {{ item.item }} still carries inline faillock values other than
      deny={{ aegis_faillock_deny }} unlock_time={{ aegis_faillock_unlock_time }}
      (found {{ aegis_faillock_inline }}, dir={{ aegis_faillock_inline_dirs }}),
      or has no pam_faillock line at all.
    quiet: true
  loop: "{{ aegis_faillock_pam_contents.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Read back faillock.conf
  ansible.builtin.slurp:
    src: "{{ aegis_faillock_conf }}"
  register: aegis_faillock_conf_content
  when: not ansible_check_mode

- name: Assert faillock.conf holds the hardened values
  vars:
    aegis_conf_text: "{{ aegis_faillock_conf_content.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - aegis_conf_text is search('(?m)^deny = ' ~ aegis_faillock_deny ~ '$')
      - aegis_conf_text is search('(?m)^unlock_time = ' ~ aegis_faillock_unlock_time ~ '$')
      - aegis_conf_text is search('(?m)^dir = ' ~ aegis_faillock_dir ~ '$')
      - (aegis_conf_text is search('(?m)^audit$')) == (aegis_faillock_audit | bool)
      - (aegis_conf_text is search('(?m)^even_deny_root$')) == (aegis_faillock_even_deny_root | bool)
    quiet: true
  when: not ansible_check_mode

- name: Bring su and su-l under the policy
  ansible.builtin.include_tasks: su.yml
  when: aegis_faillock_su_files | length > 0

# D-28, audit only. omarchy-setup-security-fido2 (4.0.6) creates
# /etc/pam.d/polkit-1 with pam_u2f, then pam_unix and no system-auth, so
# polkit password failures never reach faillock (VM, 2026-10-27: 10 wrong
# passwords, empty tally). The role does not rewrite a file Omarchy's own
# script owns; it reports it. /etc wins over the package's /usr/lib copy.
- name: Read polkit's PAM stack (D-28)
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/pam.d/polkit-1
    - /usr/lib/pam.d/polkit-1
  register: aegis_faillock_polkit_pam
  failed_when: false

- name: Record whether polkit password failures reach faillock
  vars:
    aegis_found: "{{ aegis_faillock_polkit_pam.results | selectattr('content', 'defined') | list }}"
    aegis_path: "{{ (aegis_found | first).item if aegis_found else '' }}"
    aegis_text: "{{ ((aegis_found | first).content | b64decode) if aegis_found else '' }}"
    aegis_unix: "{{ aegis_text is search('(?m)^[ \\t]*auth[ \\t]+(\\[[^\\]]*\\]|\\S+)[ \\t]+pam_unix\\.so') }}"
    aegis_counted: >-
      {{ aegis_text is search('(?m)^[ \t]*auth[ \t]+(include|substack)[ \t]+system-auth[ \t]*$')
         or aegis_text is search('(?m)^[ \t]*auth[ \t]+(\[[^\]]*\]|\S+)[ \t]+pam_faillock\.so') }}
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'auth.polkit_faillock',
            'status': 'INFO' if not aegis_found
                      else ('WARN' if (aegis_unix | bool and not aegis_counted | bool) else 'PASS'),
            'detail': 'polkit has no PAM stack (not installed)' if not aegis_found
                      else (aegis_path ~ ' checks the password with pam_unix but neither includes system-auth nor calls'
                            ~ ' pam_faillock, so polkit (pkexec) password failures are never counted (D-28;'
                            ~ ' omarchy-setup-security-fido2 writes this). Fix: replace its "auth required pam_unix.so"'
                            ~ ' line with "auth include system-auth"'
                            if (aegis_unix | bool and not aegis_counted | bool)
                            else aegis_path ~ ' counts password failures in faillock')}
         ] }}
