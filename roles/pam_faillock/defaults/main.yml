---
# Lock after 10 failed attempts, the same count Omarchy ships; the owner chose
# this over the PRD's 3 (docs/open-decisions.md D-13). The unlock time stays at
# the PRD's 15 minutes instead of Omarchy's 120 s.
#
# faillock keeps one per-user counter, and SSH (system-remote-login), console
# login, sudo and the lock screen all go through it, so this count cannot be
# set for SSH alone.
aegis_faillock_deny: 10
aegis_faillock_unlock_time: 900

aegis_faillock_conf: /etc/security/faillock.conf

# Persistent tally directory (roadmap G1, owner decision 2026-10-21). The
# pam_faillock default, /var/run/faillock, is tmpfs, so a reboot reset the
# counter. A lockout now survives a reboot, except that Omarchy's SDDM
# autologin stack runs pam_faillock authsucc, which clears it; it still clears after
# unlock_time, or with `faillock --user NAME --reset` as root.
aegis_faillock_dir: /var/lib/faillock

# D-27: polkit 127 runs PAM in polkit-agent-helper@.service, which has
# ProtectSystem=strict, so pam_faillock could not open a tally in
# aegis_faillock_dir ("Read-only file system") and pkexec refused the right
# password (VM, 2026-10-27). A drop-in gives that unit write access to the
# tally directory and nothing else. Skipped when the unit does not exist.
aegis_faillock_polkit_helper_unit: polkit-agent-helper@.service
aegis_faillock_polkit_helper_dropin: >-
  /etc/systemd/system/{{ aegis_faillock_polkit_helper_unit }}.d/aegis-faillock.conf

# Omarchy repeats deny=/unlock_time= inline on the pam_faillock lines of these
# files, and inline arguments override faillock.conf — so writing the conf file
# alone would change nothing. Files that do not exist are skipped.
aegis_faillock_pam_files:
  - /etc/pam.d/system-auth            # install/config/increase-lockout-limit.sh
  - /etc/pam.d/omarchy-lock-password  # bin/omarchy-apply-lock (lock screen)

# su/su-l (roadmap G2, owner decision 2026-10-21). Arch's su.pam calls
# pam_unix directly, so su was outside faillock. The role makes su use
# system-auth (and with it pam_faillock) and restricts su to wheel members.
# Empty the list to leave su alone.
aegis_faillock_su_files:
  - /etc/pam.d/su
  - /etc/pam.d/su-l
aegis_faillock_su_wheel_only: true

# --- Owner decisions D-18 and D-19 (2026-10-21, docs/open-decisions.md) ---

# D-18: off. `audit` logs the user name when the user does not exist; on a
# single-user desktop that is mostly a password typed into the user-name prompt.
aegis_faillock_audit: false

# D-19: also lock root after `deny` failures (su, console). Omarchy sets root's
# password to the user's password at install, so without this root could be
# guessed without limit. sulogin (rescue shell) does not use PAM, so this
# cannot block recovery. root_unlock_time defaults to unlock_time.
aegis_faillock_even_deny_root: true
aegis_faillock_root_unlock_time: "{{ aegis_faillock_unlock_time }}"
