---
# D-33: ufw needs write access to /run/ufw.lock and /etc/ufw even for status
# and --dry-run, which the drift check's unit does not give it. There, the ufw
# tasks below are skipped and ufw's own files are compared instead.
- name: Compare ufw's files with the settings (drift check, D-33)
  ansible.builtin.import_tasks: drift_read.yml
  when: aegis_drift_check_run | default(false) | bool

- name: Set the default incoming policy
  community.general.ufw:
    direction: incoming
    default: "{{ aegis_firewall_default_incoming }}"
  when: not (aegis_drift_check_run | default(false) | bool)

- name: Set the default outgoing policy
  community.general.ufw:
    direction: outgoing
    default: "{{ aegis_firewall_default_outgoing }}"
  when: not (aegis_drift_check_run | default(false) | bool)

- name: Remove the LocalSend allowances
  community.general.ufw:
    rule: allow
    port: "53317"
    proto: "{{ item }}"
    delete: true
  loop: [tcp, udp]
  when:
    - aegis_firewall_remove_localsend | bool
    - not (aegis_drift_check_run | default(false) | bool)

- name: Remove the SSH rule added by omarchy-setup-security-sshd
  community.general.ufw:
    rule: "{{ item }}"
    port: "22"
    proto: tcp
    delete: true
  loop: [limit, allow]
  when:
    - aegis_firewall_remove_ssh | bool
    - not (aegis_drift_check_run | default(false) | bool)

- name: Remove the Docker DNS allowances
  community.general.ufw:
    rule: allow
    direction: in
    proto: udp
    from_ip: "{{ item }}"
    to_ip: 172.17.0.1
    port: "53"
    delete: true
  loop: "{{ aegis_firewall_docker_dns_sources }}"
  when:
    - aegis_firewall_remove_docker_dns | bool
    - not (aegis_drift_check_run | default(false) | bool)

- name: Give ufw's sysctl file the same rp_filter as the sysctl role (D-31)
  when: aegis_firewall_ufw_rp_filter is not none
  block:
    - name: Set rp_filter in ufw's sysctl file
      ansible.builtin.replace:
        path: "{{ aegis_firewall_ufw_sysctl_conf }}"
        regexp: '^(net/ipv4/conf/(all|default)/rp_filter)[ \t]*=[ \t]*[0-9]+[ \t]*$'
        replace: '\1={{ aegis_firewall_ufw_rp_filter }}'

    - name: Read back ufw's sysctl file
      ansible.builtin.slurp:
        src: "{{ aegis_firewall_ufw_sysctl_conf }}"
      register: aegis_firewall_ufw_sysctl
      when: not ansible_check_mode

    # Every rp_filter assignment, in either spelling, must carry the value: a
    # line the replace above did not match (a future ufw) fails here instead
    # of resetting the kernel value at the next boot.
    - name: Assert ufw sets no other rp_filter value
      vars:
        aegis_values: >-
          {{ (aegis_firewall_ufw_sysctl.content | b64decode)
             | regex_findall('(?m)^[ \t]*net[/.]ipv4[/.]conf[/.][^=\s]+[/.]rp_filter[ \t]*=[ \t]*([0-9]+)') }}
      ansible.builtin.assert:
        that:
          - aegis_values | reject('equalto', aegis_firewall_ufw_rp_filter | string) | list | length == 0
        fail_msg: >-
          {{ aegis_firewall_ufw_sysctl_conf }} sets rp_filter to {{ aegis_values | join(', ') }}; ufw would
          apply that at every start, after the sysctl role's {{ aegis_firewall_ufw_rp_filter }} (D-31).
        quiet: true
      when: not ansible_check_mode

- name: Enable the firewall
  community.general.ufw:
    state: enabled
  when: not (aegis_drift_check_run | default(false) | bool)

- name: Read back the active rule set
  ansible.builtin.command:
    cmd: ufw status verbose
  register: aegis_firewall_status
  changed_when: false
  when: not ansible_check_mode

- name: Assert the firewall is active with the hardened rule set
  vars:
    aegis_firewall_status_re: '(?m)^Status: active$'
    aegis_firewall_default_re: 'Default: {{ aegis_firewall_default_incoming }} \(incoming\)'
    # A global SSH rule has its action right after the port; the D-10 rule
    # reads "22/tcp on tailscale0" and is allowed.
    # IPv6 rules read "22/tcp (v6)   LIMIT".
    aegis_firewall_ssh_re: '(?m)^22(/tcp)?( \(v6\))?\s+(ALLOW|LIMIT|DENY|REJECT)'
  ansible.builtin.assert:
    that:
      - aegis_firewall_status.stdout is search(aegis_firewall_status_re)
      - aegis_firewall_status.stdout is search(aegis_firewall_default_re)
      - not (aegis_firewall_remove_localsend | bool) or aegis_firewall_status.stdout is not search('(?m)^53317')
      - not (aegis_firewall_remove_ssh | bool) or aegis_firewall_status.stdout is not search(aegis_firewall_ssh_re)
    fail_msg: "Unexpected firewall state:\n{{ aegis_firewall_status.stdout }}"
    quiet: true
  when: not ansible_check_mode
