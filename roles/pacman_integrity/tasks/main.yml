---
# Audit only. Each block appends findings to aegis_findings; nothing here
# fails the run directly (audit_report does that, after printing everything).

- name: Parse pacman.conf, its Include= files and pacman.log
  aegis_pacman_conf:
    path: "{{ aegis_pacman_conf }}"
    log_path: "{{ aegis_pacman_log }}"
  register: aegis_pacman

- name: Record pacman signature findings
  vars:
    aegis_weak_re: '\b(Package)?(Never|Optional|TrustAll)\b'
    aegis_options: "{{ aegis_pacman.sections | selectattr('name', 'equalto', 'options') | list }}"
    aegis_global: "{{ (aegis_options | first).siglevel if aegis_options else [] }}"
    aegis_repos: "{{ aegis_pacman.sections | selectattr('siglevel') | list }}"
  ansible.builtin.set_fact:
    aegis_findings: >-
      {%- set out = [] -%}
      {%- if aegis_global | length == 1 and aegis_global[0] is search('\\bRequired\\b') -%}
        {%- set _ = out.append({'id': 'pacman.siglevel.global', 'status': 'PASS',
              'detail': '[options] SigLevel = ' ~ aegis_global[0]}) -%}
      {%- else -%}
        {%- set _ = out.append({'id': 'pacman.siglevel.global', 'status': 'FAIL',
              'detail': '[options] SigLevel must be set once and include Required (found '
                        ~ (aegis_global | to_json) ~ ')'}) -%}
      {%- endif -%}
      {%- for repo in aegis_repos -%}
        {%- for value in repo.siglevel if value is search(aegis_weak_re) -%}
          {%- set excepted = repo.name in aegis_pacman_siglevel_exceptions -%}
          {%- set _ = out.append({'id': 'pacman.siglevel.' ~ repo.name,
                'status': 'INFO' if excepted else 'FAIL',
                'detail': '[' ~ repo.name ~ '] has SigLevel = ' ~ value
                          ~ (' (accepted via aegis_pacman_siglevel_exceptions)' if excepted
                             else ', which accepts unsigned or untrusted packages')}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- if aegis_pacman.include_errors -%}
        {%- set _ = out.append({'id': 'pacman.include', 'status': 'WARN',
              'detail': aegis_pacman.include_errors | join('; ')}) -%}
      {%- endif -%}
      {{ (aegis_findings | default([])) + out }}

- name: Record mirror transport and upgrade-age findings
  vars:
    aegis_servers: "{{ aegis_pacman.sections | map(attribute='servers') | flatten }}"
    aegis_scheme_re: "^({{ aegis_pacman_allowed_server_schemes | join('|') }})://"
    aegis_bad_servers: "{{ aegis_servers | reject('search', aegis_scheme_re) | list }}"
    aegis_age: "{{ aegis_pacman.upgrade_age_days }}"
    # A fresh install has no -Syu line yet (the installer runs pacman -Sy), so
    # count from the first log entry, i.e. the install, instead of warning.
    aegis_first_age: "{{ aegis_pacman.first_log_age_days }}"
    aegis_eff_age: "{{ aegis_age if aegis_age is not none else aegis_first_age }}"
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'pacman.mirror_transport',
            'status': 'FAIL' if aegis_bad_servers else ('PASS' if aegis_servers else 'WARN'),
            'detail': ('non-' ~ (aegis_pacman_allowed_server_schemes | join('/')) ~ ' servers: '
                       ~ (aegis_bad_servers | join(', ')))
                      if aegis_bad_servers
                      else (aegis_servers | length | string) ~ ' Server entries, all '
                           ~ (aegis_pacman_allowed_server_schemes | join('/'))},
           {'id': 'pacman.upgrade_age',
            'status': 'WARN' if (aegis_eff_age is none
                                 or (aegis_eff_age | int) > aegis_pacman_max_upgrade_age_days) else 'PASS',
            'detail': ('last full upgrade ' ~ aegis_pacman.last_full_upgrade ~ ' (' ~ aegis_age
                       ~ ' days ago; limit ' ~ aegis_pacman_max_upgrade_age_days ~ ')')
                      if aegis_age is not none
                      else (('no full upgrade since the first ' ~ aegis_pacman_log ~ ' entry, '
                             ~ aegis_pacman.first_log_entry ~ ' (the install; ' ~ aegis_first_age
                             ~ ' days ago; limit ' ~ aegis_pacman_max_upgrade_age_days ~ ')')
                            if aegis_first_age is not none
                            else 'no dated entries in ' ~ aegis_pacman_log)}
         ] }}

- name: Run the integrity sweep (read-only)
  aegis_integrity_scan:
    roots: "{{ aegis_integrity_roots + (['/home'] if aegis_integrity_scan_home | bool else []) }}"
    excludes: "{{ aegis_integrity_excludes }}"
    max_report: "{{ aegis_integrity_max_report }}"
    max_files: "{{ aegis_integrity_max_files }}"
    check_package_files: "{{ aegis_integrity_check_package_files }}"
    drift_ignore: "{{ aegis_integrity_drift_ignore }}"
    drift_expected: "{{ aegis_integrity_drift_expected }}"
    drift_tightened_is_accepted: "{{ aegis_integrity_drift_tightened_is_accepted }}"
  register: aegis_scan

- name: Record integrity findings
  vars:
    aegis_setuid_unowned: >-
      {{ aegis_scan.setuid | rejectattr('package_owned')
         | rejectattr('path', 'in', aegis_integrity_setuid_allow) | list }}
    aegis_setuid_owned: "{{ aegis_scan.setuid | selectattr('package_owned') | map(attribute='path') | list }}"
    aegis_ww: >-
      {{ (aegis_scan.world_writable_files + aegis_scan.world_writable_dirs)
         | reject('in', aegis_integrity_world_writable_allow) | list }}
    aegis_denominator: "{{ aegis_scan.files_scanned }} files scanned in {{ aegis_integrity_roots | join(' ') }}"
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'integrity.scan_coverage',
            'status': 'WARN' if (aegis_scan.truncated or aegis_scan.walk_errors) else 'PASS',
            'detail': aegis_denominator
                      ~ (' (TRUNCATED at ' ~ aegis_integrity_max_files ~ ')' if aegis_scan.truncated else '')
                      ~ ('; unreadable: ' ~ (aegis_scan.walk_errors | join(', ')) if aegis_scan.walk_errors else '')},
           {'id': 'integrity.setuid_unowned',
            'status': 'FAIL' if aegis_setuid_unowned else 'PASS',
            'detail': ('setuid/setgid files no package owns: '
                       ~ (aegis_setuid_unowned | map(attribute='path') | join(', ')))
                      if aegis_setuid_unowned else 'none (' ~ aegis_denominator ~ ')'},
           {'id': 'integrity.setuid_inventory', 'status': 'INFO',
            'detail': (aegis_setuid_owned | length | string) ~ ' package-owned setuid/setgid files: '
                      ~ (aegis_setuid_owned | join(', '))},
           {'id': 'integrity.world_writable',
            'status': 'WARN' if aegis_ww else 'PASS',
            'detail': ('world-writable files or non-sticky dirs (' ~ aegis_scan.world_writable_count
                       ~ ' total): ' ~ (aegis_ww | join(', '))) if aegis_ww else 'none'},
           {'id': 'integrity.unowned_files',
            'status': 'WARN' if aegis_scan.unowned_count > 0 else 'PASS',
            'detail': (aegis_scan.unowned_count | string) ~ ' files with no matching user or group'
                      ~ (': ' ~ (aegis_scan.unowned | join(', ')) if aegis_scan.unowned else '')}
         ] }}

- name: Record package drift findings
  when: aegis_integrity_check_package_files | bool
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'integrity.package_drift_permissions',
            'status': aegis_integrity_drift_severity if aegis_scan.drift_permissions_count > 0 else 'PASS',
            'detail': (aegis_scan.drift_permissions_count | string) ~ ' package files with changed mode/owner'
                      ~ (': ' ~ (aegis_scan.drift_permissions | map(attribute='path') | join(', '))
                         if aegis_scan.drift_permissions else '')
                      ~ ' (' ~ aegis_scan.package_files_known ~ ' package files known)'},
           {'id': 'integrity.package_drift_content',
            'status': aegis_integrity_drift_severity if aegis_scan.drift_content_count > 0 else 'PASS',
            'detail': (aegis_scan.drift_content_count | string) ~ ' package files with changed size/content'
                      ~ (': ' ~ (aegis_scan.drift_content | map(attribute='path') | join(', '))
                         if aegis_scan.drift_content else '')},
           {'id': 'integrity.package_drift_accepted', 'status': 'INFO',
            'detail': (aegis_scan.drift_accepted_count | string) ~ ' known or tightened changes accepted (D-22)'
                      ~ (': ' ~ (aegis_scan.drift_accepted | map(attribute='path')
                                 | zip(aegis_scan.drift_accepted | map(attribute='why'))
                                 | map('join', ' - ') | join('; '))
                         if aegis_scan.drift_accepted else '')}
         ] }}

- name: Record sudoers NOPASSWD findings
  vars:
    aegis_known: >-
      {{ aegis_scan.nopasswd | selectattr('file', 'in', aegis_sudoers_known_nopasswd_files)
         | rejectattr('all_commands') | list }}
    aegis_other: >-
      {{ aegis_scan.nopasswd | reject('in', aegis_known) | list }}
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'sudoers.nopasswd_known', 'status': 'INFO',
            'detail': (aegis_known | length | string) ~ ' command-restricted NOPASSWD rules in Omarchy drop-ins: '
                      ~ (aegis_known | map(attribute='file') | unique | join(', '))},
           {'id': 'sudoers.nopasswd_other',
            'status': 'WARN' if aegis_other else 'PASS',
            'detail': ('NOPASSWD rules outside the known set (' ~ (aegis_scan.sudoers_files | length)
                       ~ ' sudoers files read): '
                       ~ (aegis_other | map(attribute='file') | zip(aegis_other | map(attribute='text'))
                          | map('join', ': ') | join(' | ')))
                      if aegis_other else (aegis_scan.sudoers_files | length | string) ~ ' sudoers files read, none'}
         ] }}

- name: Run the system checks from the SnowflakeOS review (read-only)
  aegis_system_audit:
    polkit_dirs: "{{ aegis_audit_polkit_dirs }}"
    sddm_paths: "{{ aegis_audit_sddm_paths }}"
  register: aegis_sys

- name: Check whether fwupd is installed
  ansible.builtin.command:
    argv: [pacman, -Q, fwupd]
  register: aegis_fwupd
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check the fwupd refresh timer
  ansible.builtin.command:
    argv: [systemctl, is-enabled, fwupd-refresh.timer]
  register: aegis_fwupd_timer
  changed_when: false
  failed_when: false
  check_mode: false
  when: aegis_fwupd.rc == 0

- name: Read the filesystem that holds /tmp
  ansible.builtin.command:
    argv: [findmnt, -no, "FSTYPE,OPTIONS", -T, "{{ aegis_audit_tmp_path }}"]
  register: aegis_tmp
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record system findings (roadmap 18k-18o)
  vars:
    aegis_tmp_fields: "{{ (aegis_tmp.stdout | default('')).split() }}"
    aegis_tmp_type: "{{ aegis_tmp_fields[0] | default('unknown') }}"
    aegis_tmp_opts: "{{ (aegis_tmp_fields[1] | default('')).split(',') }}"
    aegis_tmp_ok: "{{ aegis_tmp_type == 'tmpfs' and 'nosuid' in aegis_tmp_opts and 'nodev' in aegis_tmp_opts }}"
    aegis_autologin_bad: "{{ aegis_sys.autologin | length > 0 and not aegis_sys.root_encrypted }}"
    aegis_polkit_unknown: "{{ aegis_sys.polkit_blanket | reject('in', aegis_audit_polkit_known) | list }}"
    aegis_polkit_known_found: "{{ aegis_sys.polkit_blanket | select('in', aegis_audit_polkit_known) | list }}"
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'firmware.fwupd', 'status': 'INFO',
            'detail': ('installed; fwupd-refresh.timer ' ~ (aegis_fwupd_timer.stdout | default('unknown')))
                      if aegis_fwupd.rc == 0
                      else 'fwupd not installed (Omarchy installs it on demand via omarchy-update-firmware)'},
           {'id': 'mounts.tmp', 'status': 'PASS' if aegis_tmp_ok | bool else 'WARN',
            'detail': aegis_audit_tmp_path ~ ' is on ' ~ aegis_tmp_type ~ ' ('
                      ~ (aegis_tmp_opts | select('in', ['nosuid', 'nodev', 'noexec']) | join(',') or 'no nosuid/nodev')
                      ~ ')' ~ ('' if aegis_tmp_ok | bool else '; expected tmpfs with nosuid,nodev')},
           {'id': 'polkit.blanket_grant', 'status': 'WARN' if aegis_polkit_unknown else 'PASS',
            'detail': ('rules returning polkit.Result.YES without checking action.id: '
                       ~ (aegis_polkit_unknown | join(', ')))
                      if aegis_polkit_unknown
                      else (aegis_sys.polkit_rules_files | string)
                           ~ ' polkit rules files read, no unexpected blanket grant'
                           ~ ((' (known: ' ~ (aegis_polkit_known_found | join(', ')) ~ ')')
                              if aegis_polkit_known_found else '')},
           {'id': 'login.autologin_unencrypted', 'status': 'WARN' if aegis_autologin_bad | bool else 'PASS',
            'detail': ('autologin for ' ~ (aegis_sys.autologin | map(attribute='user') | join(', '))
                       ~ ' (' ~ (aegis_sys.autologin | map(attribute='file') | join(', ')) ~ ') while / ('
                       ~ aegis_sys.root_source ~ ') is ' ~ ('' if aegis_sys.root_encrypted else 'not ') ~ 'encrypted')
                      if aegis_sys.autologin else 'no SDDM autologin configured'},
           {'id': 'accounts.password_hash', 'status': 'WARN' if aegis_sys.weak_hashes else 'PASS',
            'detail': ('weak password hashes: '
                       ~ (aegis_sys.weak_hashes | map(attribute='user')
                          | zip(aegis_sys.weak_hashes | map(attribute='algorithm')) | map('join', ': ') | join(', '))
                       ~ ' (login.defs ENCRYPT_METHOD ' ~ (aegis_sys.encrypt_method | default('unset', true))
                       ~ '); run sudo passwd USER for each to rehash')
                      if aegis_sys.weak_hashes
                      else (aegis_sys.hashes_checked | string) ~ ' password hashes checked, all yescrypt/bcrypt/scrypt'}
         ] }}

- name: Read the group database
  ansible.builtin.getent:
    database: group

- name: Record dangerous group membership
  vars:
    aegis_groups: "{{ ansible_facts['getent_group'] }}"
  ansible.builtin.set_fact:
    aegis_findings: >-
      {%- set out = [] -%}
      {%- for name, severity in aegis_audit_dangerous_groups | dictsort -%}
        {%- set members = (aegis_groups[name][2] | default('')).split(',') | select | list
                          if name in aegis_groups else [] -%}
        {%- set _ = out.append({'id': 'groups.' ~ name,
              'status': severity if members else 'PASS',
              'detail': ('members of ' ~ name ~ ': ' ~ (members | join(', '))) if members
                        else (name ~ ': no members' if name in aegis_groups else name ~ ': group absent')}) -%}
      {%- endfor -%}
      {{ (aegis_findings | default([])) + out }}
