---
# D-38 (decided 2026-11-21, (a)): status panel in the Omarchy shell and an
# "admin mode" for a fixed list of low-risk actions. Installs the aegis CLI,
# its root helper and status writer, the polkit actions and the shell plugin,
# then reads the status file back.
- name: Report that the panel is off
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [{'id': 'panel.status', 'status': 'INFO',
         'detail': 'status panel is off (aegis_panel_enabled: false, D-38)'}] }}
  when: not aegis_panel_enabled | bool

- name: Install the status panel
  when: aegis_panel_enabled | bool
  block:
    - name: Install the back end and its findings
      ansible.builtin.import_tasks: install.yml

    - name: Install the shell plugin
      ansible.builtin.import_tasks: plugin.yml
