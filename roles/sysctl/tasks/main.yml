---
- name: Refuse the unprivileged user namespace switch until D-01 is decided
  ansible.builtin.assert:
    that:
      - not (aegis_sysctl_disable_unprivileged_userns | bool)
    fail_msg: >-
      aegis_sysctl_disable_unprivileged_userns is not implemented: it conflicts
      with the Flatpak/bubblewrap sandboxing in PRD 3.3. See docs/open-decisions.md D-01.
    quiet: true

- name: Check whether the kernel has IPv6
  ansible.builtin.stat:
    path: /proc/sys/net/ipv6
  register: aegis_sysctl_ipv6

- name: Build the effective settings
  vars:
    aegis_sysctl_optional: >-
      {{ {}
         | combine({'kernel.sysrq': aegis_sysctl_sysrq} if aegis_sysctl_sysrq is not none else {})
         | combine({'kernel.oops_limit': aegis_sysctl_oops_limit} if aegis_sysctl_oops_limit is not none else {})
         | combine({'kernel.warn_limit': aegis_sysctl_warn_limit} if aegis_sysctl_warn_limit is not none else {})
         | combine({'vm.mmap_rnd_bits': 32, 'vm.mmap_rnd_compat_bits': 16}
                   if (aegis_sysctl_mmap_rnd_max | bool and ansible_facts['architecture'] == 'x86_64') else {}) }}
  ansible.builtin.set_fact:
    aegis_sysctl_effective: >-
      {{ aegis_sysctl_settings
         | combine(aegis_sysctl_ipv6_settings if aegis_sysctl_ipv6.stat.exists else {})
         | combine(aegis_sysctl_optional) }}

# D-29: a key on aegis_sysctl_absent_ok that this kernel does not have is left
# out of the live checks below. The file keeps it (systemd-sysctl logs
# "ignoring" for a missing key), so it stays the same on every kernel.
- name: Look for the keys a kernel may be built without (D-29)
  ansible.builtin.stat:
    path: "/proc/sys/{{ item | replace('.', '/') }}"
  loop: "{{ aegis_sysctl_absent_ok | intersect(aegis_sysctl_effective.keys() | list) }}"
  register: aegis_sysctl_absent_stat

- name: Leave the compiled-out keys out of the live checks
  ansible.builtin.set_fact:
    aegis_sysctl_absent: >-
      {{ aegis_sysctl_absent_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}
    aegis_sysctl_checked: >-
      {{ aegis_sysctl_effective | dict2items
         | rejectattr('key', 'in', aegis_sysctl_absent_stat.results | rejectattr('stat.exists')
                                   | map(attribute='item') | list)
         | items2dict }}

- name: Record the keys this kernel does not have
  ansible.builtin.set_fact:
    aegis_findings: >-
      {{ (aegis_findings | default([])) + [
           {'id': 'sysctl.compiled_out', 'status': 'INFO',
            'detail': 'not in the running kernel, so the feature is compiled out: '
                      ~ (aegis_sysctl_absent | join(', '))
                      ~ ' (allowed by aegis_sysctl_absent_ok, D-29)'}
         ] }}
  when: aegis_sysctl_absent | length > 0

- name: Write the hardened sysctl drop-in
  ansible.builtin.template:
    src: aegis-hardened.conf.j2
    dest: "{{ aegis_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  register: aegis_sysctl_written

- name: Read the live kernel values
  ansible.builtin.command:
    cmd: sysctl -n {{ item.key }}
  loop: "{{ aegis_sysctl_checked | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: aegis_sysctl_before
  changed_when: false
  failed_when: false
  check_mode: false
  when: aegis_sysctl_apply | bool

# Apply when the file changed, or when a live value differs from it (someone
# changed it at runtime). Keys removed from the settings disappear from the
# file, but the kernel keeps their old values until the next reboot. With a
# compiled-out key in the file, -e makes sysctl skip unknown keys only (still
# exit 1 on any other error; measured with procps-ng 4.0.7); the read-back
# below still fails on a missing key that is not on aegis_sysctl_absent_ok.
- name: Apply the drop-in to the running kernel
  ansible.builtin.command:
    cmd: sysctl {{ '-e ' if aegis_sysctl_absent else '' }}--load={{ aegis_sysctl_file }}
  changed_when: true
  when:
    - aegis_sysctl_apply | bool
    - aegis_sysctl_written is changed
      or (aegis_sysctl_before.results
          | rejectattr('skipped', 'defined')
          | selectattr('rc', 'ne', 0) | list | length > 0)
      or (aegis_sysctl_before.results
          | rejectattr('skipped', 'defined')
          | map(attribute='stdout') | map('trim') | list)
         != (aegis_sysctl_before.results
             | rejectattr('skipped', 'defined')
             | map(attribute='item') | map(attribute='value') | map('string') | list)

- name: Read back the live kernel values
  ansible.builtin.command:
    cmd: sysctl -n {{ item.key }}
  loop: "{{ aegis_sysctl_checked | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: aegis_sysctl_live
  changed_when: false
  check_mode: false
  when: aegis_sysctl_apply | bool

- name: Assert the running kernel holds every hardened value
  ansible.builtin.assert:
    that:
      - item.stdout | trim == item.item.value | string
    fail_msg: "{{ item.item.key }} is {{ item.stdout | trim }}, expected {{ item.item.value }}"
    quiet: true
  loop: "{{ aegis_sysctl_live.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - aegis_sysctl_apply | bool
    - not ansible_check_mode

- name: Read vm.mmap_min_addr
  ansible.builtin.slurp:
    src: /proc/sys/vm/mmap_min_addr
  register: aegis_sysctl_mmap_min_addr

- name: Assert NULL-page mappings stay blocked
  ansible.builtin.assert:
    that:
      - (aegis_sysctl_mmap_min_addr.content | b64decode | trim | int) >= aegis_sysctl_mmap_min_addr_floor
    fail_msg: >-
      vm.mmap_min_addr is {{ aegis_sysctl_mmap_min_addr.content | b64decode | trim }},
      below {{ aegis_sysctl_mmap_min_addr_floor }}; something lowered it.
    quiet: true
