---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install locked tooling
        run: uv sync --frozen
      - name: pre-commit (shellcheck, yamllint, ansible-lint)
        # The gitleaks hook only scans staged changes, so it checks nothing
        # here; the next step scans the full history instead.
        env:
          SKIP: gitleaks
        run: uvx --from pre-commit==4.7.0 pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
      - name: Playbook syntax check
        run: uv run --frozen ansible-playbook omarchy-harden.yml --syntax-check

  container-test-shard:
    # tests/container/run.sh cuts the suite into shards (SHARD_STARTS) and
    # refuses to run unless they hold every check exactly once.
    name: container-test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # open-items.md §4 has the revisit trigger
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check podman is available
        run: podman --version
      - name: Run one shard of the roles against Omarchy's baseline in Arch Linux
        env:
          SHARD: ${{ matrix.shard }}
        run: tests/container/run.sh "$SHARD"

  container-test:
    # The check protect-main requires. always(): without it a failed shard
    # skips this job, and a skipped job satisfies a required check.
    needs: container-test-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.container-test-shard.result }}
        run: |
          echo "container-test shards: $RESULT"
          [ "$RESULT" = success ]

  sysctl-apply:
    # Changes the runner's kernel settings (some until reboot); fine on a
    # throwaway CI VM, never run locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the sysctl role to the live kernel
        run: sudo AEGIS_ALLOW_HOST_SYSCTL=1 tests/container/sysctl-apply.sh
