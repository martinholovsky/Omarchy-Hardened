---
# The VirtualBox test VM, reached through the NAT forward that create.sh sets
# up (127.0.0.1 only). run.sh supplies the user, key and become password.
aegis:
  hosts:
    aegis-vm:
      ansible_host: 127.0.0.1
      ansible_port: "{{ lookup('ansible.builtin.env', 'AEGIS_VM_SSH_PORT', default='2222') }}"
      # Arch's /etc/pam.d/sudo runs pam_systemd, which writes an OSC 3008
      # escape sequence to the terminal when the sudo session ends. Over a
      # pty it lands after the module's JSON and Ansible warns "junk after the
      # JSON data" on become tasks. sudo needs no tty here.
      ansible_ssh_use_tty: false
