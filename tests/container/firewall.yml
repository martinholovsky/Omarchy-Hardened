---
# Container test for the firewall role; needs NET_ADMIN (see run.sh).
- name: Apply the firewall role
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  roles:
    - firewall
    - overlay_network
  post_tasks:
    - name: Report audit findings
      ansible.builtin.import_role:
        name: audit_report
