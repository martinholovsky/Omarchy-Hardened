---
# Container test: the roles that can run without a real kernel, PAM stack or
# netfilter. Driven by tests/container/run.sh — not meant to be run by hand.
- name: Apply the container-safe roles
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars:
    aegis_require_omarchy: false
    aegis_sysctl_apply: false # /proc/sys is read-only in a container
    # The image has package drift of its own (/srv/ftp, /var/games, wall,
    # write) that a real install does not, so drift only warns here. The
    # default (FAIL) is exercised by tests/vm/.
    aegis_integrity_drift_severity: WARN
    # D-11: off except in its own test (-e aegis_drift_check_enabled=true),
    # because refreshing the copy slows down every one of the ~30 runs. Copy
    # from the writable work tree, check only the PAM area (the container has
    # no real sysctl/ufw state to compare), no desktop.
    aegis_drift_check_enabled: false
    aegis_drift_check_source: /work
    aegis_drift_check_tags: [auth]
    aegis_drift_check_notify: false
  roles:
    - preflight
    - drift_check
    - sysctl
    - pam_faillock
    - fido2
    - flatpak
    - commit_signing
    - pacman_integrity
  post_tasks:
    - name: Report audit findings
      ansible.builtin.import_role:
        name: audit_report
