[project]
name = "omarchy-hardened"
version = "0.1.0"
description = "Ansible playbook that hardens an Omarchy / Arch Linux workstation (dev tooling only)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
# Control-node tooling for linting and syntax checks. On the target machine,
# use Arch's packaged ansible-core instead (see README).
# ansible-core 2.21: security fixes until May 2027, EOL Nov 2027
# (docs.ansible.com release_and_maintenance, checked 2026-10-20).
dev = [
  "ansible-core==2.21.5",
  "ansible-lint==26.10.1",
  "yamllint==1.38.0",
  # The egress collector (roles/opensnitch/files) is checked like application
  # code: every ruff rule and strict mypy. Each pinned to a release at least
  # two weeks old when added (2026-10-24).
  "mypy==2.4.0",
  "ruff==0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
# D203/D213 conflict with D211/D212; COM812/ISC001 conflict with the formatter.
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# unittest style, fixture data and private-function access are the point here.
"tests/collector/*" = ["D", "PT", "S311", "SLF001", "PLR2004", "ANN401", "INP001", "CPY001", "FBT001"]

[tool.mypy]
strict = true
python_version = "3.12"
